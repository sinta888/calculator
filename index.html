<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU EEE MSc Fee Calculator</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 640px;
      background: #fff;
      padding: 30px 24px;
      margin: 60px auto;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h3 {
      color: #a20d33;
      text-align: center;
    }
    p {
      color: #444;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      color: #222;
    }
    select, input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
    }
    table {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
      font-size: 15px;
    }
    table td, table th {
      border: 1px solid #ddd;
      padding: 8px;
    }
    table th {
      background: #f1f1f1;
      color: #000;
    }
    .btn {
      display: inline-block;
      background: #d71440;
      color: #fff;
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      margin-top: 16px;
      cursor: pointer;
    }
    .btn:hover {
      background: #b01035;
    }
    .rte {
      margin-top: 20px;
    }
    .eligibility-message {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="eeeFeeCalculator">
      <h3>EEE MSc Fee Calculator</h3>
      <label for="pathway">Select Pathway</label>
      <select id="pathway">
        <option value="direct">Direct MSc Pathway</option>
        <option value="flexi">FlexiMasters Pathway (option to pursue MSc)</option>
      </select>

      <!-- Direct MSc Pathway -->
      <div id="directFields">
        <label for="mscStatus">Status in Singapore</label>
        <select id="mscStatus">
          <option value="scspr">Singapore Citizen / PR</option>
          <option value="intl">International</option>
        </select>

        <label for="mscAid">Eligible for Financial Aid?</label>
        <select id="mscAid">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label for="mscAlumni">NTU/NIE Alumni?</label>
        <select id="mscAlumni">
          <option value="no">No</option>
          <option value="yes">Yes (10% rebate)</option>
        </select>
      </div>

      <!-- FlexiMasters Pathway -->
      <div id="flexiFields" style="display:none;">
        <label for="flexiStatus">Status in Singapore</label>
        <select id="flexiStatus">
          <option value="scspr">Singapore Citizen / PR</option>
          <option value="intl">International</option>
        </select>

        <label for="flexiFunding">FlexiMasters Funding Scheme</label>
        <select id="flexiFunding">
          <option value="none">None / Not eligible</option>
          <option value="ssg70">SSG 70% (Citizens &lt;40 / PRs)</option>
          <option value="mces90">MCES 90% (Citizens ≥40)</option>
          <option value="etss90">ETSS 90% (SME-sponsored)</option>
        </select>

        <label for="flexiAlumni">NTU/NIE Alumni?</label>
        <select id="flexiAlumni">
          <option value="no">No</option>
          <option value="yes">Yes (eligible for S$1,600 pre-GST credit)</option>
        </select>

        <label for="skillsFuture">SkillsFuture Credits (S$)</label>
        <input type="number" id="skillsFuture" min="0" max="5000" value="0" />

        <label for="continueMsc">Do you intend to pursue the MSc after FlexiMasters?</label>
        <select id="continueMsc">
          <option value="yes">Yes, I plan to continue to MSc</option>
          <option value="no">No, FlexiMasters only</option>
        </select>
      </div>

      <p style="text-align:center;">
        <a onclick="calculateFee()" class="btn">Calculate Estimated Fee</a>
      </p>

      <div id="nettFee" class="rte"></div>
    </form>
  </div>

  <script>
    document.getElementById("pathway").addEventListener("change", function () {
      const path = this.value;
      document.getElementById("directFields").style.display = path === "direct" ? "block" : "none";
      document.getElementById("flexiFields").style.display = path === "flexi" ? "block" : "none";
    });

    function calculateFee() {
      const path = document.getElementById("pathway").value;
      let html = "";

      if (path === "direct") {
        const status = document.getElementById("mscStatus").value;
        const aid = document.getElementById("mscAid").value;
        const alumni = document.getElementById("mscAlumni").value;

        let base = 56156.8;
        let deduction = 0;

        if (status === "scspr") {
          deduction = aid === "yes" ? 15000 : 5000;
        }

        let total = base - deduction;
        if (alumni === "yes") total *= 0.9;

        html = `
          <h4>Estimated Direct MSc Pathway Fee</h4>
          <table>
            <tr><td>Base Fee</td><td>$${base.toLocaleString()}</td></tr>
            <tr><td>SC/PR Reduction</td><td>-$${deduction.toLocaleString()}</td></tr>
            <tr><td>Alumni Rebate</td><td>${alumni === "yes" ? "-10%" : "–"}</td></tr>
            <tr><th>Total Estimated Fee</th><th>$${total.toLocaleString(undefined,{minimumFractionDigits:2})}</th></tr>
          </table>`;
      } else {
        const status = document.getElementById("flexiStatus").value;
        const funding = document.getElementById("flexiFunding").value;
        const alumni = document.getElementById("flexiAlumni").value;
        const sf = parseFloat(document.getElementById("skillsFuture").value) || 0;
        const continueMsc = document.getElementById("continueMsc").value;

        const baseFlexi = 28078.4;
        let flexiFee = baseFlexi;

        if (funding === "ssg70") flexiFee = 8424;
        else if (funding === "mces90" || funding === "etss90") flexiFee = 3272;

        const alumniCredit = alumni === "yes" ? 1744 : 0;
        flexiFee -= alumniCredit;
        flexiFee -= Math.min(sf, 5000);

        let htmlBreakdown = `
          <h4>Estimated FlexiMasters Pathway Fee</h4>
          <table>
            <tr><td>FlexiMasters Stage</td><td>$${flexiFee.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`;

        if (continueMsc === "yes") {
          let mscBase = 28078.4;
          let mscDeduction = 0;
          if (status === "scspr") mscDeduction = 2500;
          let mscFee = mscBase - mscDeduction;
          if (alumni === "yes") mscFee *= 0.9;

          const total = flexiFee + mscFee;

          htmlBreakdown += `
            <tr><td>MSc Pathway (optional continuation)</td><td>$${mscFee.toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>
            <tr><th>Total Estimated Fee (FlexiMasters + MSc)</th><th>$${total.toLocaleString(undefined,{minimumFractionDigits:2})}</th></tr>`;
        } else {
          htmlBreakdown += `<tr><th>Total Estimated Fee (FlexiMasters only)</th><th>$${flexiFee.toLocaleString(undefined,{minimumFractionDigits:2})}</th></tr>`;
        }

        htmlBreakdown += `</table>`;
        html = htmlBreakdown;
      }

      document.getElementById("nettFee").innerHTML = html + `
        <div class="eligibility-message">
          *Figures are for reference only, inclusive of 9% GST. Actual payable amounts may vary based on funding eligibility and NTU’s prevailing fee structure.
        </div>`;
    }
  </script>
</body>
</html>
