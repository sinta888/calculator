<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU EEE MSc Fee Calculator</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f8f9fa; margin: 0; }
    .container { max-width: 680px; background: #fff; padding: 30px 24px; margin: 60px auto; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h3 { color: #a20d33; text-align: center; margin-top: 0; }
    p { color: #444; line-height: 1.5; }
    label { display: block; margin-top: 12px; font-weight: 600; color: #222; }
    select, input[type="number"] { width: 100%; padding: 8px 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
    table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f1f1f1; color: #000; }
    .subtotal th { background: #eef6ff; }
    .grand th { background: #e8f7ee; }
    .btn { display: inline-block; background: #d71440; color: #fff; padding: 8px 18px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; text-decoration: none; margin-top: 16px; cursor: pointer; }
    .btn:hover { background: #b01035; }
    .rte { margin-top: 20px; }
    .eligibility-message { margin-top: 10px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <form id="eeeFeeCalculator">
      <h3>EEE MSc Fee Calculator</h3>
      <p>
        Estimate your tuition fees for either the <strong>Direct MSc Pathway</strong>
        or the <strong>FlexiMasters Pathway (with option to pursue MSc)</strong>.
        All figures are <strong>inclusive of 9% GST</strong> and for reference only.
      </p>

      <label for="pathway">Select Pathway</label>
      <select id="pathway">
        <option value="direct">Direct MSc Pathway</option>
        <option value="flexi">FlexiMasters Pathway (option to pursue MSc)</option>
      </select>

      <!-- Direct MSc Pathway -->
      <div id="directFields">
        <label for="mscStatus">Status in Singapore</label>
        <select id="mscStatus">
          <option value="scspr">Singapore Citizen / PR</option>
          <option value="intl">International</option>
        </select>

        <label for="mscAid">Eligible for Financial Aid?</label>
        <select id="mscAid">
          <option value="no">No</option>
          <option value="yes">Yes</option>
        </select>

        <label for="mscAlumni">NTU/NIE Alumni?</label>
        <select id="mscAlumni">
          <option value="no">No</option>
          <option value="yes">Yes (10% rebate)</option>
        </select>
      </div>

      <!-- FlexiMasters Pathway -->
      <div id="flexiFields" style="display:none;">
        <label for="flexiStatus">Status in Singapore</label>
        <select id="flexiStatus">
          <option value="scspr">Singapore Citizen / PR</option>
          <option value="intl">International</option>
        </select>

        <label for="flexiFunding">FlexiMasters Funding Scheme</label>
        <select id="flexiFunding">
          <option value="none">None / Not eligible</option>
          <option value="ssg70">SSG 70% (Citizens &lt;40 / PRs)</option>
          <option value="mces90">MCES 90% (Citizens ≥40)</option>
          <option value="etss90">ETSS 90% (SME-sponsored)</option>
        </select>

        <label for="flexiAlumni">NTU/NIE Alumni?</label>
        <select id="flexiAlumni">
          <option value="no">No</option>
          <option value="yes">Yes (eligible for S$1,600 pre-GST credit)</option>
        </select>

        <label for="skillsFuture">SkillsFuture Credits (S$)</label>
        <input type="number" id="skillsFuture" min="0" max="5000" value="0" />

        <label for="continueMsc">Do you intend to pursue the MSc after FlexiMasters?</label>
        <select id="continueMsc">
          <option value="yes">Yes, I plan to continue to MSc</option>
          <option value="no">No, FlexiMasters only</option>
        </select>
      </div>

      <p style="text-align:center;">
        <a onclick="calculateFee()" class="btn">Calculate Estimated Fee</a>
      </p>

      <div id="nettFee" class="rte"></div>
    </form>
  </div>

  <script>
    // Constants (GST-inclusive)
    const GST = 0.09;
    const DIRECT_BASE = 56156.80;

    // Flexi stage (funded totals)
    const FLEXI_BASE = 28078.40;
    const FLEXI_SSG70 = 8424.00;
    const FLEXI_MCES90 = 3272.00;
    const FLEXI_ETSS90 = 3272.00;

    // Alumni credit for Flexi stage: 1600 pre-GST => 1744 incl GST
    const FLEXI_ALUMNI_CREDIT = 1600 * (1 + GST); // 1744

    // Self-financed MSc (modular pathway) stage
    const MSC_PATH_BASE = 28078.40;     // same base as modular path
    const MSC_PATH_SCPR_REDUCTION = 2500; // neutral “reduction” wording

    document.getElementById("pathway").addEventListener("change", function () {
      const path = this.value;
      document.getElementById("directFields").style.display = path === "direct" ? "block" : "none";
      document.getElementById("flexiFields").style.display = path === "flexi" ? "block" : "none";
      document.getElementById("nettFee").innerHTML = "";
    });

    function calculateFee() {
      const path = document.getElementById("pathway").value;
      let html = "";

      if (path === "direct") {
        // ----- Direct MSc Pathway breakdown -----
        const status = document.getElementById("mscStatus").value;
        const aid = document.getElementById("mscAid").value;
        const alumni = document.getElementById("mscAlumni").value;

        const base = DIRECT_BASE;
        const scprReduction = (status === "scspr") ? (aid === "yes" ? 15000 : 5000) : 0;
        const afterReduction = Math.max(0, base - scprReduction);
        const alumniRebateAmt = (alumni === "yes") ? afterReduction * 0.10 : 0;
        const total = Math.max(0, afterReduction - alumniRebateAmt);

        html = `
          <h4>Estimated Direct MSc Pathway Fee</h4>
          <table>
            <tr><td>Base Tuition Fee</td><td>$${fmt(base)}</td></tr>
            <tr><td>SC/PR Reduction</td><td>-$${fmt(scprReduction)}</td></tr>
            <tr><td>Alumni Rebate (10%)</td><td>-$${fmt(alumniRebateAmt)}</td></tr>
            <tr class="subtotal"><th>Total Estimated Fee</th><th>$${fmt(total)}</th></tr>
          </table>`;
      } else {
        // ----- FlexiMasters Pathway breakdown -----
        const status = document.getElementById("flexiStatus").value;
        const funding = document.getElementById("flexiFunding").value;
        const alumni = document.getElementById("flexiAlumni").value;
        const sf = Math.max(0, parseFloat(document.getElementById("skillsFuture").value) || 0);
        const continueMsc = document.getElementById("continueMsc").value;

        // FlexiMasters stage — show full breakdown
        let flexiFundingName = "None / Not eligible";
        let flexiFeeBefore = FLEXI_BASE;
        if (funding === "ssg70") { flexiFeeBefore = FLEXI_SSG70; flexiFundingName = "SSG 70%"; }
        else if (funding === "mces90") { flexiFeeBefore = FLEXI_MCES90; flexiFundingName = "MCES 90%"; }
        else if (funding === "etss90") { flexiFeeBefore = FLEXI_ETSS90; flexiFundingName = "ETSS 90%"; }
        else if (status === "intl") { flexiFundingName = "International (No funding)"; }

        const alumniCredit = (alumni === "yes") ? FLEXI_ALUMNI_CREDIT : 0;
        const skillsFutureDeduction = Math.min(sf, 5000);
        const flexiSubtotal = Math.max(0, flexiFeeBefore - alumniCredit - skillsFutureDeduction);

        let flexiTable = `
          <h4>Estimated FlexiMasters Pathway Fee</h4>
          <table>
            <tr><td>Funding Scheme (${flexiFundingName})</td><td>$${fmt(flexiFeeBefore)}</td></tr>
            <tr><td>Less: Alumni Course Credit</td><td>-$${fmt(alumniCredit)}</td></tr>
            <tr><td>Less: SkillsFuture Credits</td><td>-$${fmt(skillsFutureDeduction)}</td></tr>
            <tr class="subtotal"><th>Subtotal — FlexiMasters Stage</th><th>$${fmt(flexiSubtotal)}</th></tr>
          </table>
        `;

        if (continueMsc === "yes") {
          // Optional MSc continuation stage — breakdown
          const mscReduction = (status === "scspr") ? MSC_PATH_SCPR_REDUCTION : 0;
          const mscAfterReduction = Math.max(0, MSC_PATH_BASE - mscReduction);
          const mscAlumniRebate = (alumni === "yes") ? mscAfterReduction * 0.10 : 0;
          const mscSubtotal = Math.max(0, mscAfterReduction - mscAlumniRebate);
          const grandTotal = flexiSubtotal + mscSubtotal;

          flexiTable += `
            <h4>MSc Pathway (optional continuation)</h4>
            <table>
              <tr><td>Base Tuition Fee</td><td>$${fmt(MSC_PATH_BASE)}</td></tr>
              <tr><td>SC/PR Reduction</td><td>-$${fmt(mscReduction)}</td></tr>
              <tr><td>Alumni Rebate (10%)</td><td>-$${fmt(mscAlumniRebate)}</td></tr>
              <tr class="subtotal"><th>Subtotal — MSc Pathway Stage</th><th>$${fmt(mscSubtotal)}</th></tr>
            </table>
            <table>
              <tr class="grand"><th>Estimated Total — FlexiMasters Pathway</th><th>$${fmt(grandTotal)}</th></tr>
            </table>
          `;
        } else {
          // Flexi only (no continuation)
          flexiTable += `
            <table>
              <tr class="grand"><th>Estimated Total — FlexiMasters Only</th><th>$${fmt(flexiSubtotal)}</th></tr>
            </table>
          `;
        }

        html = flexiTable;
      }

      document.getElementById("nettFee").innerHTML = html + `
        <div class="eligibility-message">
          *Figures are for reference only, inclusive of 9% GST. Actual payable amounts may vary based on funding eligibility and NTU’s prevailing fee structure.
        </div>`;
    }

    function fmt(n) { return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  </script>
</body>
</html>
